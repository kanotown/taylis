name: chikuwachat

services:
  db:
    image: groonga/pgroonga:latest-alpine-17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chikuwa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-chikuwa}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 開発用にホストへ公開する (localhost のみ)。本番では docker-compose.prod.yml で打ち消す。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chikuwa} -d ${POSTGRES_DB:-chikuwa}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  objectstore:
    image: versity/versitygw:v1.8.0
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-chikuwa}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in infra/.env}
      VGW_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - objectstore-data:/data
    restart: unless-stopped

  app:
    build: ../server
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chikuwa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chikuwa}
      S3_ENDPOINT: http://objectstore:7070
      S3_BUCKET: ${S3_BUCKET:-chikuwa}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-chikuwa}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      # 絵文字のセットのフォルダ (M102、docs/EMOJI.md §8)。下のマウント先。空のフォルダなら何もしない
      EMOJI_PRESETS_DIR: /presets
      # 文書のプレビュー (M108、docs/PREVIEWS.md): Office ファイルを PDF にする converter。
      # infra/.env で PREVIEW_CONVERTER_URL= (空) にすると Office のプレビューを作らない (PDF は作る)
      PREVIEW_CONVERTER_URL: ${PREVIEW_CONVERTER_URL-http://converter:3000}
    depends_on:
      db:
        condition: service_healthy
      objectstore:
        condition: service_started
    networks:
      - default
      # converter への道 (外へは出られないネットワーク)
      - converter
    ports:
      # 既定は localhost のみ。同じ LAN の iPhone / Android 実機から試すときは APP_BIND=0.0.0.0 にする
      # (infra/README.md「実機での動作確認」)。本番では docker-compose.prod.yml で打ち消す。
      - "${APP_BIND:-127.0.0.1}:${APP_HOST_PORT:-8000}:8000"
    volumes:
      # APNs 認証キー (infra/.env の APNS_KEY_FILE で指定。未設定なら存在しないダミーパス)
      - ${APNS_KEY_FILE:-./secrets/apns_key.p8}:/run/secrets/apns_key.p8:ro
      # FCM サービスアカウント (infra/.env の FCM_SERVICE_ACCOUNT_FILE で指定)
      - ${FCM_SERVICE_ACCOUNT_FILE:-./secrets/fcm_service_account.json}:/run/secrets/fcm_service_account.json:ro
      # Google sign-in の client secret (M48、infra/.env の GOOGLE_CLIENT_SECRET_FILE で指定)
      - ${GOOGLE_CLIENT_SECRET_FILE:-./secrets/google_client_secret}:/run/secrets/google_client_secret:ro
      # Anthropic API キー (M65、docs/AI.md。infra/.env の ANTHROPIC_API_KEY_FILE で指定)。無ければ AI は「使えない」になるだけ
      - ${ANTHROPIC_API_KEY_FILE:-./secrets/anthropic_api_key}:/run/secrets/anthropic_api_key:ro
      # OpenAI API キー (docs/AI.md §12。infra/.env の OPENAI_API_KEY_FILE で指定)。無ければ OpenAI のモデルのボットが「使えない」になるだけ
      - ${OPENAI_API_KEY_FILE:-./secrets/openai_api_key}:/run/secrets/openai_api_key:ro
      # 在室状況の送信 Webhook の署名の鍵 (M140、docs/PRESENCE.md §5.3): 連携ごとに secret_name の名前のファイル (権限 644)
      - ${ATTENDANCE_SECRETS_DIR_HOST:-./secrets/attendance}:/run/secrets/attendance:ro
      # 操作ボタンの中継への署名の鍵 (M143、docs/ACTIONS.md §5): ボタンごとに secret_name の名前のファイル (権限 644)
      - ${ACTION_SECRETS_DIR_HOST:-./secrets/actions}:/run/secrets/actions:ro
      # 絵文字のセット (M102、docs/EMOJI.md §8): パックのフォルダ (pack.json と画像) を入れておくと起動のたびに取り込む。
      # 絵はリポジトリに入れない。本番は deploy.sh が infra/emoji-presets を作る (無いと Docker が root の空フォルダを作る)。
      # 開発で手元の /emoji を使うときは infra/.env に EMOJI_PRESETS_DIR_HOST=../emoji (docs/DEVELOPMENT.md)
      - ${EMOJI_PRESETS_DIR_HOST:-./emoji-presets}:/presets:ro
    restart: unless-stopped

  converter:
    # 文書のプレビュー (M108、docs/PREVIEWS.md): Office ファイル (doc / docx / xls / xlsx / ppt / pptx / odt / ods /
    # odp / rtf) を LibreOffice で PDF にする Gotenberg。Chromium の無い LibreOffice だけのイメージをダイジェストで固定。
    # 他人が送ったファイルを開くので閉じ込める (SECURITY.md §4「文書のプレビュー」):
    # - internal のネットワークだけに置く: ホストにもインターネットにも出られず、app からだけ届く (ポートも公開しない)
    # - 外のファイルの取得・webhook を切り、LibreOffice が文書の中の URL を取りに行くのも全部断る
    # - 1 回 90 秒・入力 55 MB で打ち切り、待ち行列は 4 件、メモリ 1 GB・CPU 1 個まで。LibreOffice は 10 回ごとに
    #   起動し直し、10 分使わなければ止める (待機中は 100 MB ほど)。変換は LibreOffice 1 つずつ (app も 1 件ずつ頼む)
    image: gotenberg/gotenberg:8.37.0-libreoffice@sha256:c85f019d6ae4927714507254331cc0ed72da7b619ee798e3a45de01f54372c12
    command:
      - gotenberg
      - --api-timeout=90s
      - --api-body-limit=55MB
      - --api-disable-download-from
      - --webhook-disable
      - --libreoffice-deny-public-ips
      - --libreoffice-deny-private-ips
      - --libreoffice-max-queue-size=4
      - --libreoffice-restart-after=10
      - --libreoffice-idle-shutdown-timeout=10m
      - --prometheus-disable-collect
    networks:
      - converter
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  livekit:
    # In-app calls for local development (M130, docs/CALLS.md §8.3 (d)): `docker compose --profile calls up -d`.
    # Dev mode: the key `devkey` / secret `secret` are LiveKit's built-in development pair, for this machine only
    # (infra/.env then sets LIVEKIT_URL / LIVEKIT_API_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET for the app,
    # docs/DEVELOPMENT.md). A server uses docker-compose.livekit.yml instead (its own secret, TURN, the firewall).
    image: livekit/livekit-server:v1.13.8
    profiles: ["calls"]
    # --bind 0.0.0.0: in dev mode LiveKit listens on 127.0.0.1 only, which the app's container cannot reach.
    # LIVEKIT_NODE_IP: the address the clients' media go to (the Mac's LAN address to try from a phone).
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
      - --config
      - /etc/livekit.yaml
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      # Signalling (ws://<host>:7880), ICE/TCP, ICE/UDP. LIVEKIT_BIND=0.0.0.0 for phones on the same Wi-Fi.
      - "${LIVEKIT_BIND:-127.0.0.1}:7880:7880"
      - "${LIVEKIT_BIND:-127.0.0.1}:7881:7881/tcp"
      - "${LIVEKIT_BIND:-127.0.0.1}:7882:7882/udp"
    restart: unless-stopped

  caddy:
    # Caddy plus the browser client (M12j): infra/web.Dockerfile builds the desktop bundle into the image.
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    image: chikuwachat-web
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CHAT_DOMAIN: ${CHAT_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

networks:
  default:
  # app と converter だけ。internal: 外 (ホスト・インターネット) への経路が無い
  converter:
    internal: true

volumes:
  db-data:
  objectstore-data:
  caddy-data:
  caddy-config:
