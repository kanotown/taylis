# LiveKit on a server (docs/CALLS.md §8.2, M130; used by docker-compose.livekit.yml). Nothing secret here and
# nothing per server: the key / secret come from secrets/livekit.env (LIVEKIT_KEYS, written by deploy.sh from
# secrets/livekit_api_secret), the public address, the TURN host name and certificate and the webhook's key from
# infra/.env through the compose file's environment (NODE_IP, LIVEKIT_TURN_*, LIVEKIT_WEBHOOK_API_KEY).
port: 7880
rtc:
  # ICE/TCP for networks that block UDP, ICE/UDP on one port (one hole in the firewall, works through Docker's
  # bridge network; enough for a few dozen people).
  tcp_port: 7881
  udp_port: 7882
  # The address is given explicitly (NODE_IP): STUN discovery would be one more thing to fail.
  use_external_ip: false
  # Bandwidth (docs/CALLS.md §8.4): the SFU estimates each subscriber's downlink and pauses / lowers simulcast
  # layers to fit (clients publish simulcast and use adaptiveStream + dynacast, M132-M135); a client whose UDP is
  # unstable moves to TCP.
  congestion_control:
    enabled: true
    allow_pause: true
  allow_tcp_fallback: true
turn:
  # The embedded TURN server: UDP 3478, and TLS 5349 for networks that only let TLS out (443 belongs to nginx on a
  # shared server, docs/CALLS.md §8.1). Clients get per-room credentials from LiveKit; it is no open relay.
  enabled: true
  udp_port: 3478
  tls_port: 5349
  # cert_file / key_file: LIVEKIT_TURN_CERT_FILE / LIVEKIT_TURN_KEY_FILE (docker-compose.livekit.yml).
room:
  empty_timeout: 120
  departure_timeout: 20
  max_participants: 50
webhook:
  # api_key: LIVEKIT_WEBHOOK_API_KEY = LIVEKIT_API_KEY (the app verifies the signature with its secret).
  # Inside the compose network only.
  urls:
    - http://app:8000/api/v1/livekit/webhook
logging:
  level: info
