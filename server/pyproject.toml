[project]
name = "chikuwachat-server"
version = "0.1.0"
description = "ChikuwaChat server (FastAPI modular monolith)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.8",
    "httpx[http2]>=0.27",
    "boto3>=1.43.103",
    "filetype>=1.2.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[s3]>=1.43.103",
    "pytest-xdist>=3.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["app", "tests", "migrations/env.py"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "filetype.*", "qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::RuntimeWarning"]
