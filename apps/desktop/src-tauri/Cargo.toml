[package]
name = "chikuwachat-desktop"
version = "0.1.0"
description = "ChikuwaChat desktop client"
edition = "2021"

[lib]
name = "chikuwachat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# External links open in the system browser. 2.5.x matches the tauri 2.11 line (2.6 needs tauri 2.12);
# keep it in step with @tauri-apps/plugin-opener in package.json.
tauri-plugin-opener = "~2.5.5"
# Google sign-in (M48, docs/SSO.md §6) returns through `chikuwachat://sso?ticket=…`. 2.4.x is the last line on
# tauri 2.11 (2.5 needs tauri 2.12); keep it in step with @tauri-apps/plugin-deep-link in package.json.
tauri-plugin-deep-link = "~2.4.10"
# In-app updates (「更新して再起動」): the updater checks kanotown/taylis-releases' latest.json, and the process plugin
# relaunches after installing. 2.12.x / 2.3.x are the last lines on tauri 2.11 (2.13 / 2.4 need tauri 2.12); keep them
# in step with @tauri-apps/plugin-updater and @tauri-apps/plugin-process in package.json.
tauri-plugin-updater = "~2.12.0"
tauri-plugin-process = "~2.3.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS notifications go through UNUserNotificationCenter (src/mac_notify.rs): the notification plugin's
# NSUserNotificationCenter never shows a banner while the app is frontmost. Same objc2 line as tauri / the plugin's.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

# Windows / Linux hand a deep link to a new process; this forwards it to the running app (its deep-link feature).
# macOS delivers the URL to the running app itself. 2.4.x for tauri 2.11, as above.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "~2.4.5", features = ["deep-link"] }
