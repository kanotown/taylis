name: ChikuwaChat
options:
  bundleIdPrefix: jp.chikuwachat
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # UI language (Japanese source, English, Simplified Chinese): Resources/Localizable.xcstrings, InfoPlist.xcstrings.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3WF4YQB4L6
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  ChikuwaChat:
    type: application
    platform: iOS
    sources:
      - path: ChikuwaChat
        excludes: ["Info.plist", "ChikuwaChat.entitlements"]
    entitlements:
      path: ChikuwaChat/ChikuwaChat.entitlements
      properties:
        aps-environment: development
        # PUSH_NOTIFICATIONS.md §16: message pushes show the sender's picture (communication notifications).
        com.apple.developer.usernotifications.communication: true
    info:
      path: ChikuwaChat/Info.plist
      properties:
        CFBundleDisplayName: Taylis
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "102"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The server URL is user-provided; self-hosted LAN deployments may use plain HTTP.
        # Production is expected behind TLS (Caddy). App Review may ask why (docs/STORE_RELEASE.md §2).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 撮った写真をメッセージに添付するために使います
        # Saving a photo or a video from a message (the share button's 「画像を保存」/「ビデオを保存」).
        NSPhotoLibraryAddUsageDescription: メッセージの写真や動画を写真ライブラリに保存するために使います
        # Only HTTPS through the system (exempt): App Store Connect then skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # PUSH_NOTIFICATIONS.md §16: the extension donates INSendMessageIntent for communication notifications.
        NSUserActivityTypes: [INSendMessageIntent]
    dependencies:
      # Embedded in the app (PlugIns/NotificationService.appex).
      - target: NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios
        # iPhone and iPad (MOBILE_UI.md §13). App Store Connect wants every iPad orientation for multitasking
        # (UISupportedInterfaceOrientations~ipad above, no UIRequiresFullScreen) and 13" iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # M40: the brand colour #5b5bd6 (a lighter #7f7ff2 in dark mode, as the web) for every control and UIKit view.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
  # PUSH_NOTIFICATIONS.md §16: turns a message push into a communication notification with the sender's picture.
  # Its versions must equal the app's (App Store Connect; release-ios.sh and StoreReleaseTests check it).
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes: ["Info.plist"]
      - path: ChikuwaChat/Platform/CommunicationNotification.swift
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Taylis
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "102"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSUserActivityTypes: [INSendMessageIntent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
  ChikuwaChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChikuwaChatTests
      - path: ../../server/tests/contract
        type: folder
        buildPhase: resources
    dependencies:
      - target: ChikuwaChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios.tests
schemes:
  ChikuwaChat:
    build:
      targets:
        ChikuwaChat: all
        ChikuwaChatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # The tests compare against the Japanese texts (the catalog's source language), whatever the simulator's.
      language: ja
      region: JP
      targets:
        - ChikuwaChatTests
