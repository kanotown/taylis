name: ChikuwaChat
options:
  bundleIdPrefix: jp.chikuwachat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3WF4YQB4L6
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  ChikuwaChat:
    type: application
    platform: iOS
    sources:
      - path: ChikuwaChat
        excludes: ["Info.plist", "ChikuwaChat.entitlements"]
    entitlements:
      path: ChikuwaChat/ChikuwaChat.entitlements
      properties:
        aps-environment: development
    info:
      path: ChikuwaChat/Info.plist
      properties:
        CFBundleDisplayName: ChikuwaChat
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "11"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The server URL is user-provided; self-hosted LAN deployments may use plain HTTP.
        # Production is expected behind TLS (Caddy). The app is installed via Xcode or TestFlight, not the App Store.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 撮った写真をメッセージに添付するために使います
        # Only HTTPS through the system (exempt): App Store Connect then skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios
        # iPhone only, as the project-level setting says: XcodeGen's application preset would otherwise make the
        # target universal ("1,2"), and App Store Connect then rejects the upload for lacking the iPad orientations.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
  ChikuwaChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChikuwaChatTests
      - path: ../../server/tests/contract
        type: folder
        buildPhase: resources
    dependencies:
      - target: ChikuwaChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios.tests
schemes:
  ChikuwaChat:
    build:
      targets:
        ChikuwaChat: all
        ChikuwaChatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChikuwaChatTests
