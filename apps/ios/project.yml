name: ChikuwaChat
options:
  bundleIdPrefix: jp.chikuwachat
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
# TeX math in messages (MathRender.swift, apps/shared/math.json); MIT, THIRD_PARTY_NOTICES.md.
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # UI language (Japanese source, English, Simplified Chinese): Resources/Localizable.xcstrings, InfoPlist.xcstrings.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3WF4YQB4L6
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  ChikuwaChat:
    type: application
    platform: iOS
    sources:
      - path: ChikuwaChat
        excludes: ["Info.plist", "ChikuwaChat.entitlements"]
      # M153a (docs/WIKI.md §30.3 / §30.4): the bundled page editor (one HTML + JS + CSS + KaTeX fonts), a folder
      # reference copied into the app as `dist/` (Xcode keeps the on-disk name) and served to a WKWebView at
      # taylis-editor://app/ (MobileEditorWebView).
      # Generated, not committed: `cd apps/desktop && npm ci && npm run build:mobile-editor`. The pre-build script
      # below stops the build with that instruction when it is missing.
      - path: ../shared/mobile-editor/dist
        name: editor
        type: folder
        buildPhase: resources
        optional: true
    preBuildScripts:
      - name: "Check the bundled page editor (apps/shared/mobile-editor/dist)"
        basedOnDependencyAnalysis: false
        script: |
          DIST="$SRCROOT/../shared/mobile-editor/dist"
          if [ ! -f "$DIST/index.html" ] || [ ! -f "$DIST/editor.js" ] || [ ! -f "$DIST/editor.css" ]; then
            echo "error: apps/shared/mobile-editor/dist is missing: the bundled page editor (docs/WIKI.md §30.3) is generated, not committed. Build it first: cd apps/desktop && npm ci && npm run build:mobile-editor"
            exit 1
          fi
    entitlements:
      path: ChikuwaChat/ChikuwaChat.entitlements
      properties:
        aps-environment: development
        # PUSH_NOTIFICATIONS.md §16: message pushes show the sender's picture (communication notifications).
        com.apple.developer.usernotifications.communication: true
        # MOBILE_UI.md §21 (Share Extension): the App Group for the workspace list, the recent conversations and the
        # pending shares, and the Keychain group for the session tokens. Both shared with ShareExtension.
        com.apple.security.application-groups: [group.jp.chikuwachat.ios]
        keychain-access-groups: [$(AppIdentifierPrefix)jp.chikuwachat.ios.shared]
    info:
      path: ChikuwaChat/Info.plist
      properties:
        CFBundleDisplayName: Taylis
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "125"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The server URL is user-provided; self-hosted LAN deployments may use plain HTTP.
        # Production is expected behind TLS (Caddy). App Review may ask why (docs/STORE_RELEASE.md §2).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 撮った写真をメッセージに添付するために使います
        # Saving a photo or a video from a message (the share button's 「画像を保存」/「ビデオを保存」).
        NSPhotoLibraryAddUsageDescription: メッセージの写真や動画を写真ライブラリに保存するために使います
        # Only HTTPS through the system (exempt): App Store Connect then skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # PUSH_NOTIFICATIONS.md §16: the extension donates INSendMessageIntent for communication notifications.
        NSUserActivityTypes: [INSendMessageIntent]
        # MOBILE_UI.md §21: what the app shares with ShareExtension (Share/SharedContainer.swift, Share/Keychain.swift).
        TaylisAppGroup: group.jp.chikuwachat.ios
        TaylisKeychainGroup: $(AppIdentifierPrefix)jp.chikuwachat.ios.shared
    dependencies:
      # Embedded in the app (PlugIns/NotificationService.appex, PlugIns/ShareExtension.appex, PlugIns/Widgets.appex).
      - target: NotificationService
      - target: ShareExtension
      - target: Widgets
      - package: SwiftMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios
        # iPhone and iPad (MOBILE_UI.md §13). App Store Connect wants every iPad orientation for multitasking
        # (UISupportedInterfaceOrientations~ipad above, no UIRequiresFullScreen) and 13" iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # M40: the brand colour #5b5bd6 (a lighter #7f7ff2 in dark mode, as the web) for every control and UIKit view.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
  # PUSH_NOTIFICATIONS.md §16: turns a message push into a communication notification with the sender's picture.
  # Its versions must equal the app's (App Store Connect; release-ios.sh and StoreReleaseTests check it).
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes: ["Info.plist"]
      - path: ChikuwaChat/Platform/CommunicationNotification.swift
      - path: ChikuwaChat/Platform/InitialsAvatar.swift
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Taylis
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "125"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSUserActivityTypes: [INSendMessageIntent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
  # MOBILE_UI.md §21: other apps (Files, Photos, GoodNotes, Safari …) share files, pictures, videos, text and links
  # into a conversation. Its versions must equal the app's (release-ios.sh and StoreReleaseTests check it).
  # The code it shares with the app is compiled into both (ChikuwaChat/Share and the files listed here).
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: ["Info.plist", "ShareExtension.entitlements"]
      - path: ChikuwaChat/Share
      - path: ChikuwaChat/Api/Multipart.swift
      - path: ChikuwaChat/Api/JSON.swift
      - path: ChikuwaChat/Api/ErrorMessages.swift
      - path: ChikuwaChat/App/Workspaces.swift
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.jp.chikuwachat.ios]
        keychain-access-groups: [$(AppIdentifierPrefix)jp.chikuwachat.ios.shared]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Taylis
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "125"
        TaylisAppGroup: group.jp.chikuwachat.ios
        TaylisKeychainGroup: $(AppIdentifierPrefix)jp.chikuwachat.ios.shared
        # The servers may be plain HTTP on a LAN (as in the app's Info.plist).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Up to 10 files (the server's limit per message, SECURITY.md §4), a link or a text.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios.ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
  # The 在室状況 widget (docs/PRESENCE.md): home screen (small, medium), lock screen and, on iOS 18, a Control Center
  # toggle. The app writes a snapshot into the App Group (ChikuwaChat/Widget, AppController+Widget.swift); the widget
  # reads it, reads the board again and switches my state with the tokens in the shared Keychain group. Its versions
  # must equal the app's (release-ios.sh and StoreReleaseTests check it). ChikuwaChat/Widget is compiled into both.
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["Info.plist", "Widgets.entitlements"]
      - path: ChikuwaChat/Widget
      - path: ChikuwaChat/Share/Keychain.swift
      - path: ChikuwaChat/Share/SharedContainer.swift
      - path: ChikuwaChat/Share/ShareDestinations.swift
      - path: ChikuwaChat/Share/ShareSession.swift
      - path: ChikuwaChat/Api/JSON.swift
      - path: ChikuwaChat/App/Workspaces.swift
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.jp.chikuwachat.ios]
        keychain-access-groups: [$(AppIdentifierPrefix)jp.chikuwachat.ios.shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Taylis
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "125"
        TaylisAppGroup: group.jp.chikuwachat.ios
        TaylisKeychainGroup: $(AppIdentifierPrefix)jp.chikuwachat.ios.shared
        # The servers may be plain HTTP on a LAN (as in the app's Info.plist).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
  ChikuwaChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChikuwaChatTests
      - path: ../../server/tests/contract
        type: folder
        buildPhase: resources
    dependencies:
      - target: ChikuwaChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: jp.chikuwachat.ios.tests
schemes:
  ChikuwaChat:
    build:
      targets:
        ChikuwaChat: all
        ChikuwaChatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # The tests compare against the Japanese texts (the catalog's source language), whatever the simulator's.
      language: ja
      region: JP
      targets:
        - ChikuwaChatTests
