name: release

# A tag v1.2.3 → the server and web checks → images in GHCR → the production VPS (infra/README.md 「自動デプロイ」).
# Deploying an existing tag again (a rollback): Run workflow with that tag chosen under "Use workflow from" (the
# production environment accepts v* tags only); the checks and the image builds are skipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer tag waits instead of cancelling one that is half done.
concurrency:
  group: production
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  images:
    needs: checks
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Release tag
        id: meta
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: ${{ vars.DEPLOY_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.registry }}/chikuwachat-server:${{ env.TAG }}
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=server
          # The cache only speeds builds up: GitHub's cache service answering with an error page failed v0.1.2 and
          # v0.1.3 after the image was built, and cancelled the push (2026-09-28).
          cache-to: type=gha,scope=server,mode=max,ignore-error=true
      - name: Web image (Caddy and the browser client)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/web.Dockerfile
          platforms: ${{ vars.DEPLOY_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.registry }}/chikuwachat-web:${{ env.TAG }}
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true

  deploy:
    needs: images
    # Also after a skipped build (a redeploy of an existing tag), never after a failed one.
    if: ${{ !failure() && !cancelled() }}
    runs-on: [self-hosted, Linux, X64]
    # The SSH secrets live in this environment; restrict it to v* tags in the repository settings.
    environment: production
    permissions:
      contents: read
      packages: write # pull on the server; after a good deploy, drop images older than the newest three
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: SSH to the production server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] \
            || { echo "set DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS in the production environment" >&2; exit 1; }
          # The runner is our own VPS: the key goes to this job's temporary folder, which the runner empties,
          # never to ~/.ssh where it would outlive the job.
          dir="$RUNNER_TEMP/deploy-ssh"
          install -m 700 -d "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          chmod 600 "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          {
            echo "Host production"
            echo "  HostName $DEPLOY_HOST"
            echo "  User ${DEPLOY_USER:-deploy}"
            echo "  Port ${DEPLOY_PORT:-22}"
            echo "  IdentityFile $dir/key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $dir/known_hosts"
            echo "  ServerAliveInterval 30"
          } > "$dir/config"
      - name: Upload the release's infra files
        run: |
          # shellcheck disable=SC2029 # the tag is meant to expand here; the server checks it again
          tar -czf - -C infra docker-compose.yml docker-compose.prod.yml docker-compose.release.yml \
              docker-compose.behind-proxy.yml Caddyfile backup.sh restore.sh deploy.sh \
            | ssh -F "$RUNNER_TEMP/deploy-ssh/config" production upload "$TAG"
      - name: Deploy (backup, pull, restart, /readyz, roll back on failure)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029 # the tag is meant to expand here; the server checks it again
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$REGISTRY_TOKEN" | ssh -F "$RUNNER_TEMP/deploy-ssh/config" production deploy "$TAG"
      - name: Forget the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
      # Only after a good deploy: GHCR storage counts against the account's Packages allowance (budget $0:
      # pushes would stop). The server keeps the current and the previous release; three here leave room for a
      # rollback from the Actions tab.
      - name: Keep the newest three server images
        uses: actions/delete-package-versions@v5
        with:
          package-name: chikuwachat-server
          package-type: container
          min-versions-to-keep: 3
      - name: Keep the newest three web images
        uses: actions/delete-package-versions@v5
        with:
          package-name: chikuwachat-web
          package-type: container
          min-versions-to-keep: 3
