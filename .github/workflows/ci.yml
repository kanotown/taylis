name: ci

on:
  push:
    branches: [main]
    # Docs (and the docs site, which pages.yml builds) alone change nothing the checks look at.
    paths-ignore: ["docs/**", "website/**", ".github/workflows/pages.yml", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "website/**", ".github/workflows/pages.yml", "**/*.md"]
  # release.yml runs the server and web checks before it builds and deploys a tag.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to main or to a pull request makes the older run's result moot, so it is cancelled.
# Tag releases call this workflow under their own ref and are never cancelled.
# All jobs run on GitHub-hosted runners: this repository is public, so its jobs (including pull requests from
# forks) must never run on a self-hosted runner or on a production server.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      db:
        image: groonga/pgroonga:latest-alpine-17
        env:
          POSTGRES_USER: chikuwa
          POSTGRES_PASSWORD: chikuwa
          POSTGRES_DB: chikuwa_test
        ports:
          # Any free host port (the test URL below reads the one Docker picked).
          - 5432
        options: >-
          --health-cmd "pg_isready -U chikuwa -d chikuwa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://chikuwa:chikuwa@localhost:${{ job.services.db.ports['5432'] }}/chikuwa_test
        run: uv run pytest -q
      - name: OpenAPI is up to date
        run: |
          uv run python -m app.cli export-openapi
          git diff --exit-code -- ../openapi/

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  android:
    # Not deployed by a release: release.yml only waits for the server and the web client.
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    # Keep the build's memory bounded on small runners: Gradle (3 GB heap) plus the Kotlin daemon and the test JVM
    # grew to 4.4 GB resident and got OOM-killed (2026-10-05). On CI: one Gradle JVM capped at 2 GB, Kotlin compiled
    # inside it, no daemon left behind, two workers.
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=2
        -Dkotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests (sync engine, contract fixtures, API client)
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain
