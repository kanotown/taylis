name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      db:
        image: groonga/pgroonga:latest-alpine-17
        env:
          POSTGRES_USER: chikuwa
          POSTGRES_PASSWORD: chikuwa
          POSTGRES_DB: chikuwa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chikuwa -d chikuwa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://chikuwa:chikuwa@localhost:5432/chikuwa_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      - name: OpenAPI is up to date
        run: |
          uv run python -m app.cli export-openapi
          git diff --exit-code -- ../openapi/
