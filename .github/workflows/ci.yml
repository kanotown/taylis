name: ci

on:
  push:
    branches: [main]
    # Docs alone change nothing the checks look at.
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  # release.yml runs the server and web checks before it builds and deploys a tag.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

# One self-hosted runner takes every job in turn: a newer push to main makes the older run's result
# moot, so it is cancelled instead of holding up the queue (and a release's deploy) for 20-40 min.
# Tag releases call this workflow under their own ref and are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  server:
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: server
    services:
      db:
        image: groonga/pgroonga:latest-alpine-17
        env:
          POSTGRES_USER: chikuwa
          POSTGRES_PASSWORD: chikuwa
          POSTGRES_DB: chikuwa_test
        ports:
          # Any free host port: the runner is a VPS that may run its own PostgreSQL on 5432.
          - 5432
        options: >-
          --health-cmd "pg_isready -U chikuwa -d chikuwa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://chikuwa:chikuwa@localhost:${{ job.services.db.ports['5432'] }}/chikuwa_test
        run: uv run pytest -q
      - name: OpenAPI is up to date
        run: |
          uv run python -m app.cli export-openapi
          git diff --exit-code -- ../openapi/

  desktop:
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  android:
    # Not deployed by a release: release.yml only waits for the server and the web client.
    if: ${{ !inputs.release }}
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/android
    # The runner shares a 12 GB VPS with the taylis server: Gradle (3 GB heap) plus the Kotlin daemon and the test
    # JVM grew to 4.4 GB resident and the OOM killer took the runner down with it (2026-10-05, twice). On CI: one
    # Gradle JVM capped at 2 GB, Kotlin compiled inside it, no daemon left behind, two workers.
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=2
        -Dkotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests (sync engine, contract fixtures, API client)
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
