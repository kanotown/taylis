name: ios

# The iOS tests run on macOS runners, billed at ten times the Linux minutes on a private repository:
# only when something the app is built from changes (and on demand).
on:
  push:
    branches: [main]
    paths: ["apps/ios/**", "apps/shared/**", "openapi/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", "apps/shared/**", "openapi/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Tests (iOS Simulator)
        run: |
          xcodebuild -project ChikuwaChat.xcodeproj -scheme ChikuwaChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 test
