name: ios

# The iOS tests run on macOS runners, billed at ten times the Linux minutes on a private repository (they were
# 70 % of the monthly allowance): on demand only (Actions → ios → Run workflow). Every change is tested on a
# developer's Mac before it is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
      # M153a (docs/WIKI.md §30.3): the page editor bundled into the app is generated from the desktop sources
      # (apps/shared/mobile-editor/dist, a folder reference; the Xcode build stops without it).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Bundled page editor
        working-directory: apps/desktop
        run: npm ci && npm run build:mobile-editor
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Tests (iOS Simulator)
        run: |
          xcodebuild -project ChikuwaChat.xcodeproj -scheme ChikuwaChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 test
