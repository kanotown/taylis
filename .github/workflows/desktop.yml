name: desktop

# Desktop installers (unsigned, macOS and Windows), kept as workflow artifacts. On demand only: Actions → desktop →
# Run workflow, choosing the release tag under "Use workflow from". The macOS runner's minutes count ten times and
# Windows' twice on a private repository, so they no longer run with every release. The desktop release script
# (apps/desktop/scripts/release-desktop.sh) dispatches it for Windows on the tag and publishes the result.
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Which installers (macOS minutes count ten times: the Mac build is usually made locally)"
        type: choice
        options: [windows, macos, both]
        default: windows

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'both' && '["macos-latest","windows-latest"]' || (inputs.os == 'macos' && '["macos-latest"]' || '["windows-latest"]')) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      # On a release tag (vX.Y.Z) the app's version is the tag's (tauri.conf.json says 0.1.0). The updater bundles are
      # not made here: the Mac that publishes the release signs the installer with the updater key, which never
      # reaches GitHub (apps/desktop/scripts/release-desktop.sh, docs/DEVELOPMENT.md 「デスクトップ版のリリース」).
      - name: tauri build
        shell: bash
        run: |
          echo "{}" > src-tauri/release.conf.json
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            echo "{\"version\":\"${BASH_REMATCH[1]}\"}" > src-tauri/release.conf.json
          fi
          cat src-tauri/release.conf.json
          npx tauri build --config src-tauri/tauri.no-updater.conf.json --config src-tauri/release.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
