# Taylis documentation site (GitHub Pages). Build: mkdocs build --strict -f website/mkdocs.yml
# Content is in website/docs/ (Japanese is the default; English pages are <name>.en.md next to the Japanese page).
# The design documents in /docs stay where they are; the site links to them on GitHub.
site_name: Taylis
site_description: 研究室や小さなチームのためのセルフホスト型チャット
site_url: https://kanotown.github.io/taylis/
site_author: Toru Kano
repo_url: https://github.com/kanotown/taylis
repo_name: kanotown/taylis
edit_uri: edit/main/website/docs/
copyright: >-
  &copy; 2026 Toru Kano · ソースコードは Apache License 2.0 ·
  「Taylis」の名前とリスのアイコンは Apache License の対象外です

theme:
  name: material
  language: ja
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Noto Sans JP
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: ライト / ダークを切り替える
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークにする
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 端末の設定に合わせる
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

plugins:
  - search:
      lang:
        - ja
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: ja
          name: 日本語
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: A self-hosted team chat for research labs and small teams
          nav:
            - Home: index.md
            - Install the apps: start/install.md
            - Self-hosting:
                - self-hosting/index.md
                - Quick start: self-hosting/quickstart.md
            - License: license.md
            - Full documentation (Japanese): https://kanotown.github.io/taylis/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tilde:
      subscript: false
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - ホーム: index.md
  - はじめに:
      - start/index.md
      - アプリを入れる: start/install.md
      - ログイン: guide/login.md
      - 機能の一覧: features.md
  - 使い方:
      - guide/index.md
      - メッセージとスレッド: guide/messages.md
      - メッセージの書き方: guide/formatting.md
      - 絵文字とリアクション: guide/emoji.md
      - 検索: guide/search.md
      - アクティビティと未読: guide/activity.md
      - ドキュメント: guide/docs.md
      - キャンバス: guide/canvas.md
      - タスクと締切: guide/tasks.md
      - カレンダーと日程調整: guide/calendar.md
      - Times: guide/times.md
      - ワークフローと定期投稿: guide/workflows.md
      - 予約: guide/reservations.md
      - 在室状況と操作ボタン: guide/attendance.md
      - AI: guide/ai.md
      - 通知の設定: guide/notifications.md
      - サイドバーと表示: guide/sidebar.md
  - 管理者:
      - admin/index.md
      - ユーザーと招待・SSO: admin/users.md
      - ロールと権限: admin/roles.md
      - アナリティクス: admin/analytics.md
      - チャンネル: admin/channels.md
      - カスタム絵文字とセット: admin/emoji.md
      - 報告とモデレーション: admin/moderation.md
      - 予約の枠: admin/reservations.md
      - 在室状況と操作ボタン: admin/attendance.md
      - ドキュメントの管理: admin/docs.md
      - AI: admin/ai.md
      - ワークスペースの設定: admin/workspace.md
  - セルフホスト:
      - self-hosting/index.md
      - クイックスタート: self-hosting/quickstart.md
      - デモを試す: self-hosting/demo.md
      - 既存のリバースプロキシの後ろで: self-hosting/reverse-proxy.md
      - プッシュ通知 (APNs / FCM): self-hosting/push.md
      - 文書のプレビュー: self-hosting/previews.md
      - バックアップと復元: self-hosting/backup.md
      - 更新と自動デプロイ: self-hosting/updates.md
      - Slack / Mattermost / Notion からの移行: self-hosting/import.md
      - 困ったとき: self-hosting/troubleshooting.md
  - 仕組み:
      - how-it-works/index.md
      - 同期と信頼性: how-it-works/sync.md
      - プッシュ通知の設計: how-it-works/push.md
      - 検索: how-it-works/search.md
      - セキュリティ: how-it-works/security.md
      - データモデル: how-it-works/data-model.md
  - FAQ: faq.md
  - プライバシー: privacy.md
  - ライセンス: license.md
